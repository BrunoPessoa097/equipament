name: CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equipament_db?schema=public

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: equipament_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d equipament_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Create test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE equipament_test_db;"

      - name: Run database migrations
        run: pnpm exec prisma migrate deploy

      - name: Run Prisma Seeds
        run: pnpm exec prisma db seed
        env:
          SEED_PUBLIC_NAME: Usuario Publico CI
          SEED_PUBLIC_EMAIL: public-ci@example.com
          SEED_PUBLIC_PASSWORD: CI-Public-Password-123
          SEED_ADMIN_NAME: Administrador CI
          SEED_ADMIN_EMAIL: admin-ci@example.com
          SEED_ADMIN_PASSWORD: CI-Admin-Password-123

      - name: Run test database migrations
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equipament_test_db?schema=public

      - name: Seed test database
        run: pnpm exec prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equipament_test_db?schema=public
          SEED_PUBLIC_NAME: Usuario Publico CI
          SEED_PUBLIC_EMAIL: public-ci@example.com
          SEED_PUBLIC_PASSWORD: CI-Public-Password-123
          SEED_ADMIN_NAME: Administrador CI
          SEED_ADMIN_EMAIL: admin-ci@example.com
          SEED_ADMIN_PASSWORD: CI-Admin-Password-123

      - name: Run ESLint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Run unit tests
        run: pnpm run test --runInBand

      - name: Configure test environment
        run: |
          printf 'POSTGRES_USER=postgres\n' >> .env
          printf 'POSTGRES_PASSWORD=postgres\n' >> .env
          printf 'POSTGRES_DB=equipament_test_db\n' >> .env
          printf 'JWT_SECRET=test-secret-for-ci\n' >> .env
          printf 'DATABASE_TEST_URL=postgresql://postgres:postgres@localhost:5432/equipament_test_db\n' >> .env

      - name: Run e2e tests
        run: pnpm run test:e2e

      - name: Build application
        run: pnpm run build
