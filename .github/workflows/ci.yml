name: CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: equipament_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equipament_test_db?schema=public
      DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/equipament_test_db
      JWT_SECRET: test-secret-for-ci
      SEED_PUBLIC_NAME: CI Public User
      SEED_PUBLIC_EMAIL: ci-public@example.test
      SEED_PUBLIC_PASSWORD: ci-public-password
      SEED_ADMIN_NAME: CI Admin User
      SEED_ADMIN_EMAIL: ci-admin@example.test
      SEED_ADMIN_PASSWORD: ci-admin-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm exec prisma migrate deploy

      - name: Run Prisma Seeds
        run: pnpm exec prisma db seed

      - name: Run ESLint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Run unit tests
        run: pnpm run test --runInBand

      - name: Configure test environment
        run: |
          printf 'POSTGRES_USER=postgres\n' >> .env
          printf 'POSTGRES_PASSWORD=postgres\n' >> .env
          printf 'POSTGRES_DB=equipament_test_db\n' >> .env
          printf 'JWT_SECRET=%s\n' "$JWT_SECRET" >> .env
          printf 'DATABASE_TEST_URL=%s\n' "$DATABASE_TEST_URL" >> .env

      - name: Run e2e tests
        run: pnpm run test:e2e

      - name: Build application
        run: pnpm run build
